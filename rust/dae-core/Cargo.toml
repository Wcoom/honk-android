[package]
name = "dae-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure-Rust rlib wrapper exposing webui/rust/dae-rs (141 DAE engine functions) without wasm-bindgen symbol collisions"

[dependencies]
fancy-regex = "0.19"
indexmap = "2"
js-sys = "0.3"
num-bigint = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
url = "2"
wasm-bindgen = "0.2"
