[package]
name = "doona-logic"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure-Rust aggregator exposing all rust-anything-gated Doona & Doona Lite port.rs modules without wasm-bindgen symbol collisions"

[dependencies]
dae-core = { path = "../dae-core" }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
sha2 = "0.10"
url = "2"
wasm-bindgen = "0.2"
