[package]
name = "doona-lite-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "Pure Rust WASM (Leptos 0.8 CSR) rewrite of Doona Lite (/ui/lite/)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
doona-common = { path = "../doona-common" }
doona-logic = { path = "../doona-logic" }
liquid-glass = { path = "../liquid-glass" }
leptos = { version = "0.8", features = ["csr"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "DomRect",
    "Element",
    "Event",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "Navigator",
    "Performance",
    "PointerEvent",
    "Storage",
    "Window",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
