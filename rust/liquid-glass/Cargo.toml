[package]
name = "liquid-glass"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Pure-Rust optical refraction, chromatic dispersion, Fresnel highlight, and iOS spring physics engine inspired by Kyant0/AndroidLiquidGlass, shared by BoxProxy Honk APK and Doona WASM WebUI."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
