[package]
name = "config-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `config.c`, generated by rust-anything"

[features]
# Export only the `rust_anything_` names, to link beside the original C code.
shadow = []

[dependencies]
libc = "0.2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
